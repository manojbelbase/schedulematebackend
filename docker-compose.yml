services:
  postgres:
    image: postgres:16-alpine
    container_name: schedulemate-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: schedulemate
    ports:
      - "5434:5432"
    volumes:
      - schedulemate_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d schedulemate"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  schedulemate_pgdata:
